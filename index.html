<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="LingoSpace" />
  <meta name="theme-color" content="#0b1220" />

  <title>LingoSpace</title>

  <style>
    :root {
      --bg: #08111f;
      --text: #f5f7fb;
      --muted: #9eabc0;
      --line: rgba(255,255,255,.10);
      --accent: #79e2b8;
      --accent-2: #78a7ff;
      --max: 900px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(120,167,255,.18), transparent 32rem),
        radial-gradient(circle at 85% 20%, rgba(121,226,184,.12), transparent 28rem),
        var(--bg);
    }

    main {
      width: min(100%, var(--max));
      text-align: center;
    }

    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: #07101d;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 18px 50px rgba(120,167,255,.20);
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 10vw, 7rem);
      line-height: .92;
      letter-spacing: -.07em;
    }

    .description {
      max-width: 650px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.2rem);
      line-height: 1.75;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      margin-top: 34px;
      padding: 0 22px;
      border: 1px solid transparent;
      border-radius: 15px;
      background: var(--text);
      color: #0b1220;
      text-decoration: none;
      font-weight: 800;
      transition: transform .18s ease, opacity .18s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: .92;
    }

    .button:focus-visible {
      outline: 3px solid var(--accent-2);
      outline-offset: 4px;
    }

    @media (max-width: 560px) {
      body {
        padding: 24px;
      }

      .mark {
        width: 50px;
        height: 50px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="mark">L</div>

    <h1>LingoSpace</h1>

    <p class="description">
      Creating simple apps.
    </p>

    <a
      class="button"
      href="https://play.google.com/store/apps/dev?id=9175019757882519671"
      target="_blank"
      rel="noreferrer"
    >
      View on Google Play
    </a>
  </main>
</body>
</html>
